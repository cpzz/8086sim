<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8086 CPU 模拟器</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>8086 CPU 模拟器</h1>

        <!-- 主内容区：左右布局 -->
        <div class="main-content">
            <!-- 左侧面板：屏幕/寄存器/内存 -->
            <div class="left-panel">
            <div class="left-tabs">
                <button class="left-tab active" data-tab="screen">屏幕</button>
                <button class="left-tab" data-tab="registers">寄存器</button>
                <button class="left-tab" data-tab="memory">内存</button>
            </div>

            <!-- 屏幕tab -->
            <div class="left-tab-content active" data-content="screen">
                <div class="display-panel">
                    <div id="ui-display-grid" class="ui-display-grid">
                        <!-- 屏幕内容将在这里动态生成 -->
                    </div>
                </div>
            </div>

            <!-- 寄存器tab -->
            <div class="left-tab-content" data-content="registers">
                <div class="registers-panel">
                    <div class="register-section">
                        <h3>通用寄存器</h3>
                        <div class="general-registers-grid">
                            <div class="general-register-row">
                                <table class="register-table general-register-group">
                                    <tr>
                                        <td class="register-name">AX</td>
                                        <td id="ax">0000H</td>
                                        <td class="register-name">AH</td>
                                        <td id="ah">00H</td>
                                        <td class="register-name">AL</td>
                                        <td id="al">00H</td>
                                    </tr>
                                </table>
                                <table class="register-table general-register-group">
                                    <tr>
                                        <td class="register-name">BX</td>
                                        <td id="bx">0000H</td>
                                        <td class="register-name">BH</td>
                                        <td id="bh">00H</td>
                                        <td class="register-name">BL</td>
                                        <td id="bl">00H</td>
                                    </tr>
                                </table>
                            </div>
                            <div class="general-register-row">
                                <table class="register-table general-register-group">
                                    <tr>
                                        <td class="register-name">CX</td>
                                        <td id="cx">0000H</td>
                                        <td class="register-name">CH</td>
                                        <td id="ch">00H</td>
                                        <td class="register-name">CL</td>
                                        <td id="cl">00H</td>
                                    </tr>
                                </table>
                                <table class="register-table general-register-group">
                                    <tr>
                                        <td class="register-name">DX</td>
                                        <td id="dx">0000H</td>
                                        <td class="register-name">DH</td>
                                        <td id="dh">00H</td>
                                        <td class="register-name">DL</td>
                                        <td id="dl">00H</td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="register-section">
                        <h3>指针/索引寄存器</h3>
                        <div class="pointer-index-registers-grid">
                            <div class="pointer-index-registers-row">
                                <table class="register-table pointer-index-registers">
                                    <tr>
                                        <td class="register-name">IP</td>
                                        <td id="ip">0000H</td>
                                        <td class="register-name">SP</td>
                                        <td id="sp">0000H</td>
                                        <td class="register-name">BP</td>
                                        <td id="bp">0000H</td>
                                    </tr>
                                </table>
                            </div>
                            <div class="pointer-index-registers-row">
                                <table class="register-table pointer-index-registers">
                                    <tr>
                                        <td class="register-name">SI</td>
                                        <td id="si">0000H</td>
                                        <td class="register-name">DI</td>
                                        <td id="di">0000H</td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="register-section">
                        <h3>标记寄存器</h3>
                        <table class="register-table flags-table">
                            <tr>
                                <td class="flag-name">CF</td>
                                <td id="cf">0</td>
                                <td class="flag-name">PF</td>
                                <td id="pf">0</td>
                                <td class="flag-name">AF</td>
                                <td id="af">0</td>
                                <td class="flag-name">ZF</td>
                                <td id="zf">0</td>
                                <td class="flag-name">SF</td>
                                <td id="sf">0</td>
                                <td class="flag-name">TF</td>
                                <td id="tf">0</td>
                                <td class="flag-name">IF</td>
                                <td id="if">0</td>
                                <td class="flag-name">DF</td>
                                <td id="df">0</td>
                                <td class="flag-name">OF</td>
                                <td id="of">0</td>
                            </tr>
                        </table>
                    </div>

                    <div class="register-section">
                        <h3>段寄存器</h3>
                        <table class="register-table segment-registers">
                            <tr>
                                <td class="register-name">CS</td>
                                <td id="cs">0000H</td>
                                <td class="register-name">DS</td>
                                <td id="ds">0000H</td>
                                <td class="register-name">SS</td>
                                <td id="ss">0000H</td>
                                <td class="register-name">ES</td>
                                <td id="es">0000H</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 内存tab -->
            <div class="left-tab-content" data-content="memory">
                <div class="memory-panel">
                    <!-- 内存段选择tab -->
                    <div class="memory-segment-tabs">
                        <button class="memory-segment-tab active" data-segment="cs">代码段 (CS)</button>
                        <button class="memory-segment-tab" data-segment="ds">数据段 (DS)</button>
                        <button class="memory-segment-tab" data-segment="ss">堆栈段 (SS)</button>
                        <button class="memory-segment-tab" data-segment="es">附加段 (ES)</button>
                    </div>

                    <div class="memory-controls">
                        <input type="text" id="memory-address-input" placeholder="偏移地址 (例如: 0x1000)">
                        <button id="memory-go-btn">前往</button>
                        <button id="memory-prev-btn">上页</button>
                        <button id="memory-next-btn">下页</button>
                    </div>
                    <div id="memory-grid" class="memory-grid">
                        <!-- 内存内容将在这里动态生成 -->
                    </div>
                </div>
            </div>
            </div>

            <!-- 右侧面板：代码 -->
            <div class="right-panel">
                <div class="code-panel">
                <!-- 顶部：标题和控制面板 -->
                <div class="code-control-header">
                    <span class="header-item">代码</span>
                    <span class="header-item status-indicator" id="status-indicator">[初始状态]</span>
                    <div class="control-panel">
                        <button id="load-btn">加载文件</button>
                        <input type="file" id="file-input" accept=".asm" style="display: none;">
                        <button id="step-btn">单步执行</button>
                        <button id="run-btn">执行</button>
                        <button id="pause-btn">暂停</button>
                        <button id="reset-btn">重置</button>
                    </div>
                </div>

                <!-- 代码表格 -->
                <div class="instructions-panel">
                    <div class="instructions-table">
                        <div class="instructions-table-header">
                            <div class="instructions-table-cell address">偏移地址</div>
                            <div class="instructions-table-cell machine-code">机器码</div>
                            <div class="instructions-table-cell assembly">汇编指令</div>
                            <div class="instructions-table-cell comment">注释</div>
                        </div>
                        <div id="instructions-list" class="instructions-table-body">
                            <!-- 代码将在这里动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- 导入cpu javascript文件 -->
    <script src="scripts/cpu/core.js"></script>
    <script src="scripts/cpu/registers.js"></script>
    <script src="scripts/cpu/memory.js"></script>
    <script src="scripts/cpu/addressing.js"></script>
    <script src="scripts/cpu/flags.js"></script>
    <script src="scripts/cpu/breakpoints.js"></script>
    <script src="scripts/cpu/interrupts/int21h.js"></script>
    <script src="scripts/cpu/interrupts/int16h.js"></script>
    <script src="scripts/cpu/execution.js"></script>

    <!-- 导入assembler javascript文件 -->
    <script src="scripts/assembler/core.js"></script>
    <script src="scripts/assembler/directives.js"></script>
    <script src="scripts/assembler/operand-parser.js"></script>
    <script src="scripts/assembler/data-parser.js"></script>
    <script src="scripts/assembler/instruction-parser.js"></script>
    <script src="scripts/assembler/instruction-length.js"></script>

    <!-- 导入display javascript文件 -->
    <script src="scripts/display/memory.js"></script>
    <script src="scripts/display/register.js"></script>
    <script src="scripts/display/screen.js"></script>
    <script src="scripts/display/instruction.js"></script>

    <!-- 导入其他javascript文件 -->
    <script src="scripts/memory.js"></script>
    <script src="scripts/keyboard.js"></script>
    <script src="scripts/simulator.js"></script>
</body>
</html>
